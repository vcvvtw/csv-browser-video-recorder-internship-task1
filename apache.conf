<VirtualHost *:80>
    ServerName localhost
    ServerAdmin webmaster@localhost
    DocumentRoot /app

    # Pass environment variables to WSGI process
    PassEnv DB_HOST
    PassEnv DB_PORT
    PassEnv DB_NAME
    PassEnv DB_USER
    PassEnv DB_PASSWORD
    PassEnv UPLOADS_DIR

    # WSGI Daemon Configuration
    WSGIDaemonProcess videos user=www-data group=www-data threads=5 python-home=/venv python-path=/app
    WSGIProcessGroup videos
    WSGIApplicationGroup %{GLOBAL}
    WSGIScriptAlias / /app/web_service.wsgi
    WSGIPassAuthorization On
    WSGIImportScript /app/web_service.wsgi process-group=videos application-group=%{GLOBAL}

    # Static file delivery for uploaded videos directly via Apache
    Alias /media /app/uploads
    <Directory /app/uploads>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        AddType video/webm .webm
    </Directory>

    <Directory /app>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        <Files web_service.wsgi>
            Require all granted
        </Files>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
